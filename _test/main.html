<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página com Classes CSS</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <!-- Parágrafos com classes -->
    <p class="destaque1">Parágrafo em destaque</p>
    <p class="texto-grande">Parágrafo grande</p>
    <p class="texto-azul">Parágrafo azul</p>
    <p class="fundo-cinza">Parágrafo com fundo cinza</p>
    
    <!-- Títulos com classes e ID -->
    <h1 id="titulo-principal" class="titulo-principal">Título Principal</h1>
    <h2 class="subtitulo">Subtítulo</h2>
    
    <!-- Div com classes e classe aninhada -->
    <div class="box">
        <p class="texto-centralizado">Texto centralizado dentro da box</p>
        <p class="texto-interno">Texto com estilo de classe aninhada</p>
    </div>
    
    <!-- Span com classe -->
    <p>Texto com <span class="destaque-texto">parte destacada</span> no meio</p>
    
    <!-- Botão com classe e ID -->
    <button id="btn-acao" class="botao">Clique aqui</button>

    <!-- Exemplo de classe aninhada extra -->
    <div class="card">
        <h3 class="card-titulo">Card com classe aninhada</h3>
        <p class="card-texto">Conteúdo do card usando seletores aninhados no CSS.</p>
    </div>
</body>
</html>
